<head>
  <!--
  ═══════════════════════════════════════════════════════════════════════════
   GCC SCHOOL · APPLICATION FOR HIRING DRIVE SLOT BOOKING (full-screen quiz)
  ═══════════════════════════════════════════════════════════════════════════
   Reached from index-v2.html after the visitor registers (name, phone, city…).
   Lead details arrive via sessionStorage["gcc_lead"] (set by index-v2.html).
   Open this page with ?demo=1 to preview without registering first.

   • One question per screen, tap-to-advance (Coursiv-style), progress bar, back.
   • Answers auto-save to localStorage so a refresh never loses progress.
   • On completion: answers are POSTed (see CONFIG.QUIZ_ENDPOINT), then the
     interview-slot calendar appears, then the confirmation screen.
   • Edit QUESTIONS below to add / remove / reorder questions.
  ═══════════════════════════════════════════════════════════════════════════
  -->

  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <meta name="robots" content="noindex">
  <title>Application for Hiring Drive Slot Booking | GCC School</title>
  <link rel="shortcut icon" href="https://storage.googleapis.com/static_files_backend/media/images/image.png">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=Figtree:wght@400;500;600;700&display=swap"
    rel="stylesheet">

  <style>
    :root {
      --ink: #14101F;
      --ink-2: #4A4458;
      --ink-3: #7E7891;
      --purple: #51157C;
      --purple-2: #6A22A0;
      --purple-soft: #F3EEFA;
      --amber: #F1A63E;
      --amber-d: #C77E14;
      --tile: #F4F5F7;
      --tile-line: #E9E9EE;
      --line: #ECECF1;
      --green: #16A34A;
      --green-soft: #EAF7EF;
      --red: #DC2626;
      --f-d: 'Sora', 'Segoe UI', sans-serif;
      --f-b: 'Figtree', 'Segoe UI', sans-serif;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    html {
      -webkit-text-size-adjust: 100%
    }

    body {
      font-family: var(--f-b);
      color: var(--ink);
      background: #fff;
      line-height: 1.5;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      -webkit-tap-highlight-color: transparent
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      background: none;
      color: inherit;
      touch-action: manipulation
    }

    input,
    select,
    textarea {
      font-family: inherit;
      font-size: 16px;
      color: var(--ink)
    }

    h1,
    h2 {
      font-family: var(--f-d);
      letter-spacing: -.02em;
      line-height: 1.2
    }

    /* ── top bar ── */
    .top {
      position: sticky;
      top: 0;
      z-index: 10;
      background: #fff
    }

    .top-in {
      max-width: 720px;
      margin: 0 auto;
      padding: 12px 16px 10px;
      display: grid;
      grid-template-columns: 44px 1fr 44px;
      align-items: center
    }

    .back {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      color: var(--ink);
      visibility: hidden
    }

    .back.on {
      visibility: visible
    }

    .back:hover {
      background: var(--tile)
    }

    .brand {
      text-align: center
    }

    .brand img {
      height: 36px;
      width: auto;
      display: inline-block
    }

    .count {
      text-align: right;
      font-family: var(--f-d);
      font-weight: 700;
      font-size: 13px;
      color: var(--ink-3)
    }

    .count b {
      color: var(--purple)
    }

    .rail {
      max-width: 720px;
      margin: 0 auto;
      padding: 0 16px 10px
    }

    .rail .bar {
      height: 4px;
      border-radius: 999px;
      background: var(--tile);
      overflow: hidden
    }

    .rail .fill {
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, var(--purple), var(--purple-2));
      border-radius: 999px;
      transition: width .35s ease
    }

    .app-title {
      max-width: 720px;
      margin: 0 auto;
      padding: 0 16px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--ink-3);
      text-align: center
    }

    /* ── stage ── */
    .stage {
      flex: 1;
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      padding: 22px 16px 120px
    }

    .screen {
      animation: in .28s ease
    }

    .screen.out {
      animation: out .18s ease forwards
    }

    @keyframes in {
      from {
        opacity: 0;
        transform: translateX(24px)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    @keyframes out {
      to {
        opacity: 0;
        transform: translateX(-24px)
      }
    }

    .q-title {
      font-size: clamp(22px, 5.6vw, 28px);
      font-weight: 800;
      text-align: center;
      color: var(--ink)
    }

    .q-sub {
      text-align: center;
      color: var(--ink-2);
      font-size: 15.5px;
      margin-top: 8px
    }

    .q-sub b {
      color: var(--ink)
    }

    .opts {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 24px
    }

    .opts.grid {
      display: grid;
      grid-template-columns: 1fr 1fr
    }

    .tile {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      min-height: 68px;
      padding: 14px 16px;
      text-align: left;
      background: var(--tile);
      border: 1px solid var(--tile-line);
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      color: var(--ink);
      transition: transform .12s, background .15s, border-color .15s, box-shadow .15s
    }

    .tile .em {
      font-size: 26px;
      line-height: 1;
      width: 34px;
      text-align: center;
      flex: none
    }

    .tile .lb {
      flex: 1;
      line-height: 1.3
    }

    .tile .lb small {
      display: block;
      font-weight: 500;
      font-size: 13px;
      color: var(--ink-3);
      margin-top: 2px
    }

    .tile .tick {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid #CFCBD9;
      flex: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: #fff
    }

    .tile.box .tick {
      border-radius: 6px
    }

    .tile:hover {
      border-color: var(--purple);
      background: #fff
    }

    .tile:active {
      transform: scale(.985)
    }

    .tile.sel {
      background: var(--purple-soft);
      border-color: var(--purple);
      box-shadow: 0 0 0 3px rgba(81, 21, 124, .12)
    }

    .tile.sel .tick {
      background: var(--purple);
      border-color: var(--purple)
    }

    .tile.sel .tick::after {
      content: "✓"
    }

    .opts.grid .tile {
      flex-direction: column;
      text-align: center;
      padding: 20px 12px;
      gap: 10px
    }

    .opts.grid .tile .em {
      width: auto;
      font-size: 34px
    }

    .opts.grid .tile .tick {
      display: none
    }

    /* fields */
    .fields {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-top: 24px
    }

    .fld {
      display: flex;
      flex-direction: column;
      gap: 6px
    }

    .fld>span {
      font-size: 13px;
      font-weight: 700;
      color: var(--ink-2)
    }

    .fld>span i {
      font-style: normal;
      font-weight: 500;
      color: var(--ink-3)
    }

    .in {
      width: 100%;
      min-height: 54px;
      border: 1.5px solid var(--tile-line);
      border-radius: 12px;
      padding: 14px 16px;
      background: var(--tile);
      outline: none;
      transition: border-color .15s, background .15s, box-shadow .15s
    }

    .in:focus {
      border-color: var(--purple);
      background: #fff;
      box-shadow: 0 0 0 3px rgba(81, 21, 124, .12)
    }

    textarea.in {
      min-height: 110px;
      resize: vertical;
      line-height: 1.5
    }

    .in::placeholder {
      color: #A9A3B8
    }

    .fld.err .in {
      border-color: var(--red)
    }

    .fld .fe {
      display: none;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--red)
    }

    .fld.err .fe {
      display: block
    }

    .row2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px
    }

    .hint {
      font-size: 12.5px;
      color: var(--ink-3);
      margin-top: 6px
    }

    /* interstitial */
    .inter {
      text-align: center;
      padding-top: 12px
    }

    .inter .big {
      font-family: var(--f-d);
      font-weight: 800;
      font-size: clamp(26px, 6.4vw, 34px);
      color: var(--purple);
      line-height: 1.15
    }

    .inter .big .g {
      color: var(--amber-d)
    }

    .inter p {
      color: var(--ink-2);
      font-size: 16px;
      margin-top: 12px;
      max-width: 480px;
      margin-left: auto;
      margin-right: auto
    }

    .inter .art {
      margin: 26px auto 0;
      max-width: 440px;
      border-radius: 18px;
      background: linear-gradient(160deg, #2A0B4E, #51157C);
      color: #fff;
      padding: 22px 20px;
      text-align: left;
      box-shadow: 0 18px 50px rgba(42, 11, 78, .18)
    }

    .inter .art .k {
      font-size: 11px;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--amber);
      font-weight: 700;
      font-family: var(--f-d)
    }

    .inter .art .v {
      font-family: var(--f-d);
      font-weight: 800;
      font-size: 24px;
      margin-top: 6px
    }

    .inter .art .s {
      font-size: 13.5px;
      color: rgba(255, 255, 255, .8);
      margin-top: 6px;
      line-height: 1.5
    }

    .inter .art ul {
      list-style: none;
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 14px
    }

    .inter .art li::before {
      content: "✓";
      color: var(--amber);
      font-weight: 800;
      margin-right: 8px
    }

    /* bottom CTA */
    .cta {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 9;
      background: linear-gradient(to top, #fff 70%, rgba(255, 255, 255, 0));
      padding: 18px 16px calc(16px + env(safe-area-inset-bottom))
    }

    .cta-in {
      max-width: 720px;
      margin: 0 auto
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      min-height: 56px;
      border-radius: 12px;
      background: var(--purple);
      color: #fff;
      font-family: var(--f-d);
      font-weight: 700;
      font-size: 15.5px;
      letter-spacing: .04em;
      text-transform: uppercase;
      box-shadow: 0 8px 24px rgba(81, 21, 124, .28);
      transition: transform .15s, background .15s, opacity .15s
    }

    .btn:hover {
      background: var(--purple-2);
      transform: translateY(-1px)
    }

    .btn[disabled] {
      opacity: .45;
      cursor: not-allowed;
      transform: none;
      box-shadow: none
    }

    .btn.amber {
      background: var(--amber);
      color: #2A0B4E;
      box-shadow: 0 8px 24px rgba(241, 166, 62, .35)
    }

    .btn.amber:hover {
      background: #F6B95F
    }

    .cta .skip {
      display: block;
      text-align: center;
      margin-top: 10px;
      font-size: 13.5px;
      font-weight: 600;
      color: var(--ink-3);
      text-decoration: underline;
      text-underline-offset: 3px
    }

    .cta[hidden],
    .cta .skip[hidden] {
      display: none
    }

    /* calendar */
    .cal {
      margin-top: 22px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px
    }

    .cal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px
    }

    .cal-head b {
      font-family: var(--f-d);
      font-size: 16px
    }

    .cal-nav {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      border: 1.5px solid var(--tile-line);
      font-size: 18px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center
    }

    .cal-wd {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      font-size: 11px;
      font-weight: 700;
      color: var(--ink-3);
      text-align: center;
      margin-bottom: 4px
    }

    .cal-days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 5px
    }

    .cd {
      min-height: 50px;
      border-radius: 9px;
      border: 1.5px solid var(--tile-line);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 13.5px;
      font-weight: 700;
      color: var(--ink);
      background: #fff;
      padding: 3px 0
    }

    .cd small {
      font-size: 9px;
      font-weight: 600;
      color: var(--ink-3);
      line-height: 1.1;
      margin-top: 2px
    }

    .cd.avail {
      border-color: rgba(22, 163, 74, .45);
      background: var(--green-soft);
      cursor: pointer
    }

    .cd.avail small {
      color: var(--green)
    }

    .cd.low {
      border-color: rgba(220, 38, 38, .45);
      background: #FEF2F2
    }

    .cd.low small {
      color: var(--red)
    }

    .cd.sel {
      background: var(--purple);
      border-color: var(--purple);
      color: #fff
    }

    .cd.sel small {
      color: #fff
    }

    .cd.off {
      opacity: .35;
      cursor: not-allowed
    }

    .cd.empty {
      border: none;
      background: transparent
    }

    .cal-info {
      font-size: 14px;
      font-weight: 600;
      text-align: center;
      color: var(--ink-2);
      margin-top: 12px;
      min-height: 20px
    }

    .chk {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      font-size: 13.5px;
      color: var(--ink-2);
      line-height: 1.45;
      margin-top: 12px
    }

    .chk input {
      width: 18px;
      height: 18px;
      margin-top: 2px;
      accent-color: var(--purple);
      flex: none
    }

    /* done */
    .done {
      text-align: center;
      padding-top: 20px
    }

    .done-ic {
      width: 74px;
      height: 74px;
      border-radius: 50%;
      background: var(--green);
      color: #fff;
      font-size: 34px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      box-shadow: 0 12px 30px rgba(22, 163, 74, .3)
    }

    .done h1 {
      font-size: 26px
    }

    .done p {
      color: var(--ink-2);
      margin-top: 10px;
      font-size: 15.5px
    }

    .ref {
      display: inline-block;
      margin-top: 14px;
      font-size: 12.5px;
      font-weight: 700;
      letter-spacing: .06em;
      padding: 7px 14px;
      border-radius: 999px;
      background: var(--purple-soft);
      color: var(--purple)
    }

    .next {
      text-align: left;
      margin: 22px auto 0;
      max-width: 460px;
      display: flex;
      flex-direction: column;
      gap: 12px
    }

    .next .n {
      display: flex;
      gap: 12px;
      font-size: 14.5px;
      color: var(--ink-2);
      line-height: 1.5
    }

    .next .n .d {
      flex: none;
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: #FDF3E3;
      color: var(--amber-d);
      font-family: var(--f-d);
      font-weight: 800;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center
    }

    .wa {
      margin-top: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 54px;
      border-radius: 12px;
      background: #25D366;
      color: #fff;
      font-family: var(--f-d);
      font-weight: 700;
      text-decoration: none
    }

    .foot {
      text-align: center;
      font-size: 12px;
      color: var(--ink-3);
      padding: 10px 16px 24px
    }

    @media (min-width: 640px) {
      .stage {
        padding-top: 34px
      }

      .q-title {
        margin-top: 6px
      }

      .opts.grid {
        grid-template-columns: repeat(3, 1fr)
      }
    }

    @media (prefers-reduced-motion: reduce) {

      .screen,
      .screen.out {
        animation: none
      }
    }
  </style>
</head>

<body>
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5NVDGXLR" height="0" width="0"
      style="display:none;visibility:hidden"></iframe></noscript>

  <header class="top">
    <div class="top-in">
      <button type="button" class="back" id="back" aria-label="Back">←</button>
      <div class="brand"><img src="./images/gcc-logo.jpeg" alt="GCC School"></div>
      <div class="count" id="count"></div>
    </div>
    <div class="app-title">Application for Hiring Drive Slot Booking</div>
    <div class="rail">
      <div class="bar">
        <div class="fill" id="fill"></div>
      </div>
    </div>
  </header>

  <main class="stage" id="stage" aria-live="polite"></main>

  <div class="cta" id="cta" hidden>
    <div class="cta-in">
      <button type="button" class="btn" id="next">Continue</button>
      <a href="#" class="skip" id="skip" hidden>Skip this question</a>
    </div>
  </div>

  <script>
    /* ═══════════════════════════════════════════════════════════════
       CONFIG
    ═══════════════════════════════════════════════════════════════ */
    var CONFIG = {
      PROGRAM: 'AEUAP',
      DRIVE_LABEL: 'AEUAP Batch 2 Hiring Drive',
      DEADLINE: '2026-11-01T23:59:59+05:30',     // caps the interview calendar — keep in sync with index-v2.html
      WHATSAPP: '',                              // e.g. '919876543210'. Empty = WhatsApp button hidden
      LANDING_URL: './index-v2.html#apply',      // where to send someone who opens this page without registering
      MAX_SLOTS_PER_DAY: 30,
      SOURCE_ID: 15,
      /* Where the completed application is sent.
         QUIZ_ENDPOINT: any URL that accepts a JSON POST (Google Apps Script web app, Zapier/Make webhook, your CRM).
         If it is empty and QUIZ_FALLBACK_TO_DOSSIER is true, the full application is POSTed to the same
         createdossiercustomform API used by the landing page, tagged form_position: "quiz" and carrying the
         original lead_id / dossier_id so the CRM can merge it with the registration. */
      QUIZ_ENDPOINT: '',
      QUIZ_FALLBACK_TO_DOSSIER: true
    };
    var API_PROD = "https://gcc-backend-prod.gccschool.com";
    var API_DEV = "https://gcc-backend-prod.gccschool.com";
    var API_BASE = (location.hostname.indexOf('gccschool.com') > -1) ? API_PROD : API_DEV;

    /* ═══════════════════════════════════════════════════════════════
       QUESTIONS — edit freely. Types: single (tap to advance), multi,

      var my = stage.querySelector('[data-my]'), days = stage.querySelector('[data-days]'), info = stage.querySelector('[data-info]'), doc = stage.querySelector('[data-doc]');
      var MN = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
      function draw() {
        var y = cur.getFullYear(), m = cur.getMonth(); my.textContent = MN[m] + ' ' + y; days.innerHTML = '';
        var off = (new Date(y, m, 1).getDay() + 6) % 7, total = new Date(y, m + 1, 0).getDate(), today = new Date(); today.setHours(0, 0, 0, 0);
        for (var i = 0; i < off; i++) { var e = document.createElement('div'); e.className = 'cd empty'; days.appendChild(e); }
        for (var d = 1; d <= total; d++) (function (d) {
          var cell = document.createElement('button'); cell.type = 'button'; cell.className = 'cd';
          var date = new Date(y, m, d), ds = String(d).padStart(2, '0') + '-' + String(m + 1).padStart(2, '0') + '-' + y;
          var wk = date.getDay() === 0 || date.getDay() === 6, past = date < today, after = date > maxDate;
          var slot = slotData.find(function (s) { return s.date === ds; }), booked = slot ? parseInt(slot.count, 10) || 0 : 0, rem = CONFIG.MAX_SLOTS_PER_DAY - booked;
          cell.innerHTML = '<span>' + d + '</span>'; var sm = document.createElement('small');
          if (past || wk || after || !slot) { sm.textContent = '–'; cell.classList.add('off'); cell.disabled = true; }
          else if (rem <= 0) { sm.textContent = 'Full'; cell.classList.add('off'); cell.disabled = true; }
          else {
            sm.textContent = rem + ' left'; cell.classList.add('avail'); if (rem <= 5) cell.classList.add('low');
            cell.addEventListener('click', function () {
              days.querySelectorAll('.cd.sel').forEach(function (x) { x.classList.remove('sel'); }); cell.classList.add('sel'); sel = ds;
              info.innerHTML = '<span style="color:var(--green)">Selected: <b>' + ds + '</b> · ' + rem + ' seats left</span>'; upd();
            });
          }
          cell.appendChild(sm); if (sel === ds) cell.classList.add('sel'); days.appendChild(cell);
        })(d);
      }
      function upd() { nextBtn.disabled = !(sel && doc.checked); }
      stage.querySelectorAll('[data-nav]').forEach(function (b) { b.addEventListener('click', function () { cur.setMonth(cur.getMonth() + parseInt(b.dataset.nav, 10)); draw(); }); });
      doc.addEventListener('change', upd);
      stage.querySelector('[data-skip]').addEventListener('click', function (e) { e.preventDefault(); trk('SlotSkipped', {}); renderDone(false); });
      nextBtn.onclick = function () {
        if (!sel) return; nextBtn.disabled = true; nextBtn.textContent = 'Booking your seat…';
        var p = sel.split('-'), ymd = p[2] + '-' + p[1] + '-' + p[0];
        var req = DEMO ? Promise.resolve() : fetch(API_BASE + '/api/students/create-student-interview-slot/', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ lid: parseInt(LEAD.serverId, 10), interview_date: ymd }) }).catch(function () { });
        req.then(function () { trk('Schedule', { content_name: CONFIG.DRIVE_LABEL, interview_date: ymd }, true); trk('SlotBooked', { interview_date: ymd }); renderDone(sel); });
      };
      draw();
    }

    function renderDone(dateStr) {
      MODE = 'done'; cta.hidden = true; nextBtn.onclick = null;
      var wa = '';
      if (CONFIG.WHATSAPP) {
        var msg = encodeURIComponent('Hi, I have completed my application for the ' + CONFIG.DRIVE_LABEL + '. My application ID is ' + LEAD.leadId + (dateStr ? ' and my interview date is ' + dateStr : '') + '. Please confirm my seat.');
        wa = '<a class="wa" href="https://wa.me/' + CONFIG.WHATSAPP + '?text=' + msg + '" target="_blank" rel="noopener">Confirm on WhatsApp →</a>';
      }
      stage.innerHTML = '<div class="screen"><div class="done"><div class="done-ic">✓</div><h1>Application submitted, ' + esc(FIRST) + '!</h1>'
        + '<p>' + (dateStr ? 'Your interview date is <b>' + dateStr + '</b> at GCC School Campus, Gurugram. ' : '') + 'Keep your phone on — here is what happens next.</p>'
        + '<span class="ref">Application ID · ' + esc(LEAD.leadId) + '</span>'
        + '<div class="next">'
        + '<div class="n"><span class="d">24h</span><span><b>Our counsellor calls you</b>' + (A.call_time ? ' in the ' + esc(A.call_time.split(' (')[0].toLowerCase()) : '') + (A.decision && A.decision.indexOf('myself') < 0 ? ', with your family on the call,' : '') + ' to confirm your seat' + (dateStr ? '' : ' and fix your interview date') + '.</span></div>'
        + '<div class="n"><span class="d">🏢</span><span><b>Company interview</b> at 9B DLF Cyber City, Gurugram. Bring your documents.</span></div>'
        + '<div class="n"><span class="d">₹</span><span><b>Clear it → written ₹10 LPA Pre-Placement Offer</b> — before any fee.</span></div>'
        + '</div>' + wa + '<p class="foot" style="margin-top:22px"><a href="' + CONFIG.LANDING_URL.split('#')[0] + '" style="color:var(--ink-3)">← Back to GCC School</a></p></div></div>';
      try { localStorage.removeItem('gcc_quiz_' + LEAD.leadId); } catch (e) { }
    }

    /* resume where the user left off */
    (function () { try { var saved = JSON.parse(localStorage.getItem('gcc_quiz_' + LEAD.leadId) || 'null'); if (saved && typeof saved.idx === 'number') idx = Math.min(saved.idx, visible().length - 1); } catch (e) { } })();
    render(1);
  </script>
</body>

</html>
