name: Deploy to DigitalOcean

# Runs alongside the AWS workflow (deploy.yml), which is left unchanged.
# Runs on every push to the digitalocean-deploy branch, or by hand from the Actions tab
# (the Run workflow button appears once this file is on the default branch).
# Server setup this relies on: docs/deploy-static-digitalocean.md
on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: deploy-digitalocean-get-hired
  cancel-in-progress: false

env:
  APP_DIR: /var/www/apps/get-hired   # releases/ and the "current" symlink live here
  KEEP_RELEASES: 5                   # older releases are deleted after a deploy

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      ######################################################
      # Checkout Repository (uses the built-in GITHUB_TOKEN)
      ######################################################
      - name: Checkout Repository
        uses: actions/checkout@v4

      ######################################################
      # Package the site (no build step: the files are served as they are)
      ######################################################
      - name: Package Site
        run: |
          set -e
          RELEASE="$(date +%Y%m%d_%H%M%S)"
          ARCHIVE="release_${RELEASE}.tar.gz"

          # Left out: git data, editor settings, docs, and the landing-page generator
          # and its keyword map, which are internal and not part of the site
          tar -czf "$RUNNER_TEMP/$ARCHIVE" \
            --exclude=./.git \
            --exclude=./.github \
            --exclude=./.vscode \
            --exclude=./docs \
            --exclude=./landing-pages \
            --exclude=./landing-pages-map.csv \
            --exclude='.DS_Store' \
            .
          mv "$RUNNER_TEMP/$ARCHIVE" .

          echo "RELEASE=$RELEASE" >> "$GITHUB_ENV"
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"
          ls -lh "$ARCHIVE"

      ######################################################
      # Upload Package to the Droplet
      ######################################################
      - name: Copy Package
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: ${{ env.ARCHIVE }}
          target: ${{ env.APP_DIR }}/uploads

      ######################################################
      # Activate Release (atomic symlink switch)
      ######################################################
      - name: Activate Release
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          envs: APP_DIR,RELEASE,ARCHIVE,KEEP_RELEASES
          script: |
            set -e
            TARGET="$APP_DIR/releases/$RELEASE"

            echo "Deploying release $RELEASE"
            mkdir -p "$TARGET"
            tar -xzf "$APP_DIR/uploads/$ARCHIVE" -C "$TARGET"
            rm -f "$APP_DIR/uploads/$ARCHIVE"

            test -f "$TARGET/index.html" || { echo "ERROR: index.html missing in release"; exit 1; }

            # Switch traffic to the new release in one step
            ln -sfn "$TARGET" "$APP_DIR/current.tmp"
            mv -Tf "$APP_DIR/current.tmp" "$APP_DIR/current"

            # Keep only the newest releases
            cd "$APP_DIR/releases"
            ls -1t | tail -n +$((KEEP_RELEASES + 1)) | xargs -r rm -rf

            echo "Live: $(readlink -f "$APP_DIR/current")"
